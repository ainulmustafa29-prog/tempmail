<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — TempMailBox | Get in Touch</title>
  <meta name="description" content="Contact TempMailBox with questions, suggestions, or feedback about our free temporary email service.">
  <link rel="canonical" href="https://tempmailbox.example.com/contact.html">
  <meta property="og:title" content="Contact TempMailBox">
  <meta property="og:description" content="Send us your questions, suggestions, or feedback.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tempmailbox.example.com/contact.html">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p class="page-subtitle">Have a question or suggestion? We'd love to hear from you.</p>
      </div>
    </section>

    <section class="content-section">
      <div class="container container-narrow">
        <form id="contact-form" class="contact-form card-shadow" novalidate>
          <div class="mb-3">
            <label for="contact-name" class="form-label">Name <span class="text-danger" aria-hidden="true">*</span></label>
            <input type="text" class="form-control" id="contact-name" name="name" required autocomplete="name" aria-required="true">
            <div class="invalid-feedback" id="name-error" role="alert"></div>
          </div>
          <div class="mb-3">
            <label for="contact-email" class="form-label">Email <span class="text-danger" aria-hidden="true">*</span></label>
            <input type="email" class="form-control" id="contact-email" name="email" required autocomplete="email" aria-required="true">
            <div class="invalid-feedback" id="email-error" role="alert"></div>
          </div>
          <div class="mb-3">
            <label for="contact-message" class="form-label">Message <span class="text-danger" aria-hidden="true">*</span></label>
            <textarea class="form-control" id="contact-message" name="message" rows="5" required aria-required="true"></textarea>
            <div class="invalid-feedback" id="message-error" role="alert"></div>
          </div>
          <div id="contact-feedback" class="contact-feedback" role="status" aria-live="polite" hidden></div>
          <button type="submit" class="btn btn-primary" id="contact-submit">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/contact.js" defer></script>
  <script src="js/theme.js" defer></script>
</body>
</html>
